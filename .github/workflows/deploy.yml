# Builds and checks the site on every pull request, and deploys it to Cloudflare Pages
# on every push to the default branch.
#
# One-time setup in GitHub > Settings > Secrets and variables > Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN  (a token with "Cloudflare Pages: Edit")
#              CLOUDFLARE_ACCOUNT_ID
#   Variables: SITE_URL        optional, defaults to the pages.dev address below
#              ALLOW_INDEXING  optional, set to "true" only when the site should be indexed
name: Build and deploy

on:
  push:
    branches: [claude/sharp-brahmagupta-wgpv5k, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: vincent-portfolio
  SITE_URL: ${{ vars.SITE_URL || 'https://vincent-portfolio-2lj.pages.dev' }}
  ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - name: Check SEO
        run: npm run check:seo
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set, so the build was checked but not deployed."
            exit 0
          fi
          # A secret pasted with a line break or surrounding text cannot be sent as a header.
          # Keep only the token itself (Cloudflare user tokens start with "cfut_"), or failing
          # that the first word, and report the shape of what was stored without printing it.
          lines=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -c '' || true)
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -s '[:space:]' '\n' | grep -m1 '^cfut_' || true)
          if [ -z "$token" ]; then token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -s '[:space:]' '\n' | grep -m1 . || true); fi
          if [ "$lines" -gt 1 ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is stored as $lines lines; using the token found in it (${#token} characters). Re-save the secret as one line to clear this warning."
          fi
          export CLOUDFLARE_API_TOKEN="$token"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"
